    <script type="text/javascript">
      // 404.html から渡された元のURL（パス・クエリ・ハッシュ）を復元する
      (function(){
        var redirect = null;
        try {
          redirect = sessionStorage.getItem('redirect');
          sessionStorage.removeItem('redirect');
        } catch (e) {}
        if (!redirect) {
          redirect = new URLSearchParams(window.location.search).get('p');
        }
        // アプリ内のパスだけを受け付ける（//example.com のような外部URLは無視）
        if (redirect && /^\/(?![\/\\])/.test(redirect)) {
          history.replaceState(null, '', redirect);
        } else if (redirect) {
          history.replaceState(null, '', '/');
        }
      })();
    </script>
