<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>法律文書一覧</title>
    <script type="text/javascript">
      // SPAの場合のGitHub Pages向けリダイレクト（クエリとハッシュも index.html で復元する）
      (function(){
        var l = window.location;
        var path = l.pathname + l.search + l.hash;
        try { sessionStorage.setItem('redirect', path); } catch (e) {}
        window.location.replace('/?p=' + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body></body>
</html>
